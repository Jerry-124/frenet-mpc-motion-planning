[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frenet-mpc-motion-planning"
version = "0.1.0"
description = "Frenet-frame motion planning with nonlinear MPC trajectory tracking"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]

[tool.setuptools]
py-modules = [
  "benchmark",
  "config",
  "dynamic_model_benchmark",
  "fallback_demo",
  "main",
  "planner_demo",
  "replanning_demo",
  "robustness_benchmark",
  "sensitivity_benchmark",
  "simulation",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["control*", "evaluation*", "models*", "planning*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
