[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "frenet-mpc-motion-planning"
version = "1.1.1"
description = "Frenet-frame motion planning and trajectory tracking with nonlinear MPC"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "matplotlib>=3.8",
]
classifiers = [
  "License :: OSI Approved :: MIT License",
]

[project.urls]
Repository = "https://github.com/Jerry-124/frenet-mpc-motion-planning"

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.16,<0.17",
]

[tool.setuptools]
py-modules = [
  "benchmark",
  "config",
  "dynamic_model_benchmark",
  "fallback_demo",
  "main",
  "planner_demo",
  "replanning_demo",
  "robustness_benchmark",
  "sensitivity_benchmark",
  "simulation",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["control*", "evaluation*", "models*", "planning*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# SLSQP can transiently step outside box bounds during line search; SciPy clips
# those trial values internally. Constraint/regression tests still verify the
# returned controller behavior and physical limits.
filterwarnings = [
  "ignore:Values in x were outside bounds during a minimize step, clipping to bounds:RuntimeWarning:scipy\\.optimize\\._slsqp_py",
]