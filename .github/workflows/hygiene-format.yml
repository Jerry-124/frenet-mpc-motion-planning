name: hygiene-format

on:
  push:
    branches: [chore/repository-hygiene]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/repository-hygiene
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project and development tooling
        run: python -m pip install -e '.[dev]'
      - name: Apply Ruff formatter
        run: ruff format .
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "style: apply Ruff formatter"
          git push origin HEAD:chore/repository-hygiene
