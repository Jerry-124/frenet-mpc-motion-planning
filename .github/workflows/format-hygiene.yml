name: temporary-format-hygiene

on:
  push:
    branches: [chore/repository-hygiene]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/repository-hygiene
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Ruff
        run: python -m pip install "ruff>=0.16,<0.17"
      - name: Apply Ruff formatting
        run: ruff format .
      - name: Commit formatting changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No formatting changes"
          else
            git commit -m "style: apply Ruff formatting"
            git push origin HEAD:chore/repository-hygiene
          fi
