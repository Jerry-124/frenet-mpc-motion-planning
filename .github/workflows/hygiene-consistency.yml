name: hygiene-consistency

on:
  push:
    branches: [chore/repository-hygiene]

permissions:
  contents: write

jobs:
  fix-readme:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: chore/repository-hygiene
      - name: Remove stale documentation references
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = '''For the complete methodology, validation matrix, limitations, and resume/interview material, see:

          - [`docs/PROJECT_REPORT.md`](docs/PROJECT_REPORT.md)
          - [`docs/RESUME_INTERVIEW_GUIDE_CN.md`](docs/RESUME_INTERVIEW_GUIDE_CN.md)
          - [`CHANGELOG.md`](CHANGELOG.md)
          '''
          new = '''For release history and portfolio hardening notes, see [`CHANGELOG.md`](CHANGELOG.md).
          '''
          if old not in text:
              raise SystemExit("Expected README documentation block not found")
          text = text.replace(old, new, 1)
          text = text.replace(
              "docs/PROJECT_REPORT.md     consolidated methodology and results report\n"
              "docs/RESUME_INTERVIEW_GUIDE_CN.md resume bullets and interview preparation\n",
              "",
              1,
          )
          text = text.replace(
              "physical-parameter validation, consolidated reporting, and resume/interview documentation are complete.",
              "physical-parameter validation and repository-level reporting are complete.",
              1,
          )
          path.write_text(text, encoding="utf-8")
          PY
      - name: Commit consistency fixes
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: remove stale repository references"
          git push origin HEAD:chore/repository-hygiene
